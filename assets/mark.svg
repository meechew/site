<svg xmlns="http://www.w3.org/2000/svg" viewBox="-14 -14 268 268" width="268" height="268">
  <!-- Colorful River — primary mark ("electric fill" badge). Source of truth for all raster exports. -->
  <defs>
    <filter id="neon" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3.4" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <linearGradient id="gSky" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0" y2="136">
      <stop offset="0"    stop-color="#12061F"/>
      <stop offset="0.38" stop-color="#7C3AED"/>
      <stop offset="0.68" stop-color="#FF2E88"/>
      <stop offset="1"    stop-color="#FF7A1A"/>
    </linearGradient>
    <linearGradient id="gGround" gradientUnits="userSpaceOnUse" x1="0" y1="136" x2="0" y2="240">
      <stop offset="0" stop-color="#241448"/>
      <stop offset="1" stop-color="#0E081F"/>
    </linearGradient>
    <linearGradient id="gRiver" gradientUnits="userSpaceOnUse" x1="0" y1="136" x2="0" y2="240">
      <stop offset="0"    stop-color="#FFC24D"/>
      <stop offset="0.38" stop-color="#FF4D9E"/>
      <stop offset="0.75" stop-color="#00CFFF"/>
      <stop offset="1"    stop-color="#00E5FF"/>
    </linearGradient>

    <clipPath id="clip"><circle cx="120" cy="120" r="113"/></clipPath>

    <!-- Locked-count CRT raster lines: 2-unit line on a 5-unit pitch (exactly 5 lines across
         the sun's visible height), phased so the sun's top edge (y=111) and the horizon
         (y=136) fall mid-gap -->
    <pattern id="scan" patternUnits="userSpaceOnUse" x="0" y="107.5" width="240" height="5">
      <rect x="0" y="0" width="240" height="2" fill="#000000" opacity="0.26"/>
    </pattern>

    <g id="tree">
      <polygon points="0,-34 -9,-14 9,-14"/>
      <polygon points="0,-26 -12,-4 12,-4"/>
      <polygon points="0,-18 -15,6 15,6"/>
    </g>
  </defs>

  <g clip-path="url(#clip)">
    <rect x="0" y="0" width="240" height="136" fill="url(#gSky)"/>
    <circle cx="120" cy="132" r="44" fill="#FFD54F" opacity="0.3"/>
    <circle cx="120" cy="132" r="21" fill="#FFE28A"/>
    <path d="M0,136 L0,108 C24,95 46,103 64,115 C78,124 94,131 110,136 Z" fill="#5B1E7E"/>
    <path d="M240,136 L240,104 C214,92 194,102 176,114 C162,123 148,130 132,136 Z" fill="#5B1E7E"/>
    <path d="M0,136 L0,124 C30,113 54,121 76,131 L86,136 Z" fill="#3B1160"/>
    <path d="M240,136 L240,120 C210,110 186,119 166,129 L156,136 Z" fill="#3B1160"/>
    <rect x="0" y="136" width="240" height="104" fill="url(#gGround)"/>
    <path d="M113,136 C103,156 129,170 121,188 C115,202 92,216 72,240 L196,240 C170,214 152,204 146,190 C140,174 160,152 127,136 Z" fill="url(#gRiver)"/>
    <g fill="#14A86B">
      <use href="#tree" transform="translate(88,150) scale(0.45)"/>
      <use href="#tree" transform="translate(66,158) scale(0.6)"/>
      <use href="#tree" transform="translate(42,170) scale(0.8)"/>
      <use href="#tree" transform="translate(64,186) scale(0.95)" fill="#22E893"/>
      <use href="#tree" transform="translate(30,200) scale(1.15)" fill="#22E893"/>
      <use href="#tree" transform="translate(56,224) scale(1.3)" fill="#22E893"/>
      <use href="#tree" transform="translate(22,242) scale(1.5)" fill="#22E893"/>
      <use href="#tree" transform="translate(157,151) scale(0.45)"/>
      <use href="#tree" transform="translate(174,158) scale(0.6)"/>
      <use href="#tree" transform="translate(198,170) scale(0.8)"/>
      <use href="#tree" transform="translate(176,186) scale(0.95)" fill="#22E893"/>
      <use href="#tree" transform="translate(210,200) scale(1.15)" fill="#22E893"/>
      <use href="#tree" transform="translate(206,224) scale(1.25)" fill="#22E893"/>
      <use href="#tree" transform="translate(222,242) scale(1.5)" fill="#22E893"/>
    </g>
    <rect x="0" y="0" width="240" height="240" fill="url(#scan)"/>
  </g>

  <circle cx="120" cy="120" r="113" fill="none" stroke="#FF2E88" stroke-width="7" filter="url(#neon)"/>
</svg>
